<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Disclone</title>
	<link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <h1>Disclone</h1>
    <h2>Login</h2>
    <form class="left-vert-align">
      <input 
        name="Username" 
        type="text" 
        placeholder="Username"
        id="username"/>
      <input 
        name="Password" 
        type="password"
        placeholder="Password"
        id="password"/>
      <div>
        <button 
          type="submit"
          name="Log In"
          id="login">
        Log In</button>
        <button 
          type="button"
          name="Sign Up"
          id="signup">
        Sign Up</button>
      </div>
      <p style="font-size: 12px;" id="state"></p>
    </form>

  </body>
	<script src="login.js"></script>
</html>
