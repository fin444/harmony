<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harmony - Login</title>
	<link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body style="display: flex; flex-direction: column; place-items: center; justify-content: center; padding-bottom: 70px;">
        <header style="margin-left: 10px; display: flex; flex-direction: row; align-items: center;">
            <div class="logo-icon"></div>
            <h2>Harmony</h2>
        </header>    <div class="login-content">
      <h3>Login</h3>
      <form class="left-vert-align">
      <input 
        name="Username" 
        type="text" 
        placeholder="Username"
        id="username"/>
      <input 
        name="Password" 
        type="password"
        placeholder="Password"
        id="password"/>
      <div>
        <button 
          type="submit"
          name="Log In"
          id="login">
        Log In</button>
        <button 
          type="button"
          name="Sign Up"
          id="signup">
        Sign Up</button>
      </div>
      <p style="font-size: 12px;" id="state"></p>
      </form>
    </div>

  </body>
	<script src="login.js"></script>
</html>
