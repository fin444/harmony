<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Disclone</title>
	<link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <h1>Disclone</h1>
    <h2>Login</h2>
    <div class="left-vert-align">
      <input 
        name="Username" 
        type="text" 
        placeholder="Username"
        id="username"/>
      <input 
        name="Password" 
        type="password"
        placeholder="Password"
        id="password"/>
      <div>
        <button 
          name="Log In" 
          id="submit">
        Log In</button>
      </div>
    </div>

  </body>
	<script src="login.js"></script>
</html>
